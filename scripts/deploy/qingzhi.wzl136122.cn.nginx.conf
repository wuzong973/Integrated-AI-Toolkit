# ============================================================================
# 《青智校园》生产站点 —— qingzhi.wzl136122.cn
#
# 落地位置：/www/server/panel/vhost/nginx/qingzhi.wzl136122.cn.conf
#   （主配置 `include /www/server/panel/vhost/nginx/*.conf;` 在 http 层，
#     所以**只新增本文件**即可生效，不需要改 nginx.conf）
#
# ## 与既有两个站点的关系：只新增，不修改
#
#   本机已有：
#     wzl136122.cn.conf          → apex + www，`my-api` 在 127.0.0.1:3000
#     lovechoice-domain.conf     → lovestory.wzl136122.cn，`lovechoice-api` 在 127.0.0.1:8787
#   本文件是**第三个**独立站点，精确匹配 `qingzhi.wzl136122.cn`。
#   nginx 的 server_name 优先级是「精确 > 通配 > default_server」，
#   所以既不会抢走 `0.default.conf` 的 `server_name _`，也不会影响另外两个。
#
#   ⚠️ 改完必须 `nginx -t` 通过后再 `nginx -s reload`。
#      本文件写错会让**整台机器**的 nginx 重新加载失败，另外两个项目一起挂；
#      而 `reload` 是平滑的（不断开已有连接），`restart` 会断 —— 一律用 reload。
#
# ## 后端端口 3100
#
#   3000 是 `my-api`、8787 是 `lovechoice-api`，都已被占。本项目管理端口 3100，
#   只绑 127.0.0.1（见 ecosystem.config.cjs），公网扫不到，
#   因此**不需要**动 firewalld，也不需要改腾讯云安全组。
#
# ## 存储：local 驱动，同域，没有 oss. 子域
#
#   本阶段 `STORAGE_DRIVER=local`，上传/下载走 `/api/v1/files/local/:token`，
#   与 API 同域同证书 —— 所以**不需要**独立的对象存储子域。
#   （若将来切回 MinIO/OSS，要新增一个不带路径前缀的子域，
#     因为 SigV4 签名覆盖规范化路径，挂 `/oss` 前缀会 403 SignatureDoesNotMatch。）
# ============================================================================

# ---------- HTTP：只做 ACME 校验与跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name qingzhi.wzl136122.cn;

    # 证书续期通道。⚠️ 这段必须留着：acme.sh 的 cron 续期走 HTTP-01，
    # 删掉之后证书到期续不了，而续期失败只会在 90 天后才暴露。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/qingzhi.wzl136122.cn;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/qingzhi.wzl136122.cn.log;
}

# ---------- HTTPS：管理后台 + API + WebSocket ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qingzhi.wzl136122.cn;

    # ---------- 管理后台（apps/admin 的 vite 产物） ----------
    # ⚠️ root 指向 dist 而不是仓库根：仓库根放着 `.env`（含密钥），
    #    把仓库根当站点根会把它置于"只差一个 location 规则"的位置。
    #    指向 dist 后，仓库根下任何文件都不在 nginx 的服务范围内。
    root /www/wwwroot/qingzhi.wzl136122.cn/apps/admin/dist;
    index index.html;
    charset utf-8;

    # 后台用 BrowserRouter（history 路由），直接访问 /orders 这类子路径
    # 必须回落到 index.html，否则刷新即 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物可长期缓存
    # ⚠️ nginx 的 `add_header` **不会**从 server 块继承到「自己也有 add_header 的 location」，
    #    所以这三条安全头必须在这里重复一遍 —— 少写不会报错，只是响应里悄悄没有它们。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    location ~* \.woff2?$ {
        types { font/woff2 woff2; font/woff woff; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # index.html 绝不能缓存，否则发版后用户一直拿到旧版（引用已失效的 assets）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---------- API ----------
    # `^~` 前缀匹配优先级高于正则，保证 /api/v1/... 不会被上面的静态规则抢走
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 应用侧按 X-Forwarded-Proto 判断是否把自产 URL 升成 https；
        # 漏了会让小程序拿到 http 链接，被微信拦掉。
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传上限：与 .env 的 UPLOAD_MAX_VIDEO_MB(500) 量级对齐；
        # STORAGE_DRIVER=local 时上传也走这里，所以这个值必须能容纳单个文件。
        client_max_body_size 220m;
        proxy_connect_timeout 10s;
        # 同步工具（compress_image / convert_image 等 sync:true）是"请求内等结果"的。
        # 必须 ≥ 服务端预算换算到网关层的上限，否则用户看到 504 而后端仍在跑并照常落库 ——
        # 与 `npm run check:timeout-budget` 是同一类"两端判定相反"的问题。
        proxy_read_timeout  180s;
        proxy_send_timeout  180s;
        proxy_buffering off;
    }

    # ---------- WebSocket（作业进度推送，小程序连 /ws?token=…） ----------
    # 原生 ws（不是 socket.io）。握手必须透传 Upgrade，否则前端只会静默退回轮询，
    # 表现为"进度条不动"而不是报错。
    location ^~ /ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 敏感文件一律拒绝（与既有站点同口径，这里按本项目路径收窄）
    location ~* /(\.git|\.env|node_modules)/ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ---------- 证书 ----------
    ssl_certificate     /www/server/panel/vhost/cert/qingzhi.wzl136122.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/qingzhi.wzl136122.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    # ⚠️ 会话缓存名必须全局唯一：与另外两个站点重复名字虽然能用，
    #    但排查时无法区分是哪张证书的会话，且将来改参数会互相影响。
    ssl_session_cache shared:SSL_QZ:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /www/wwwlogs/qingzhi.wzl136122.cn.log;
    error_log  /www/wwwlogs/qingzhi.wzl136122.cn.error.log;
}
