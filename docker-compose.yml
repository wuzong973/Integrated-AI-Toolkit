# 《青智校园》本地基础设施（任务清单 M0-09）
# 只包含开发所需的基础服务；业务服务在宿主机以 npm run dev 启动
# 用法：docker compose up -d   /   docker compose down
#
# 数据库：MySQL 8.4（原 PostgreSQL 16，迁移原因见 docs/architecture/DB-MIGRATION-POSTGRES-TO-MYSQL.md）
#   升级镜像大版本后若无法启动，需先清空数据卷：docker compose down -v
version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: qz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: qz_root_password
      MYSQL_DATABASE: qingzhi
      MYSQL_USER: qz
      MYSQL_PASSWORD: qz_dev_password
      TZ: Asia/Shanghai
    # 字符集与时区在服务端锁定，避免不同客户端连接出现中文乱码
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    ports:
      - '3306:3306'
    volumes:
      - qz-mysqldata:/var/lib/mysql
      - ./scripts/db/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # 注意：容器内需用 127.0.0.1 而非 localhost，否则会走 socket 且密码校验行为不一致
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      # MySQL 首次初始化（建库、建用户、执行 init 脚本）耗时较长，给足冷启动时间
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: qz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - qz-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: qz-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - qz-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 6

  # 自动创建 bucket（一次性）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/qingzhi-dev &&
      echo 'bucket qingzhi-dev ready'
      "
    restart: 'no'

volumes:
  qz-mysqldata:
  qz-redisdata:
  qz-miniodata:
